[project]
name = "task-mcp"
version = "0.1.0"
description = "DevBrain Task MCP — list/search/get/create/update/complete tasks"
requires-python = ">=3.12"
dependencies = [
  # Pinned <2.0 for the same reason as services/knowledge_mcp/pyproject.toml:
  # mcp>=2.0.0 dropped the classic `mcp.server.fastmcp.FastMCP`
  # decorator-based API this service is built against. Keep in sync with
  # Knowledge MCP's pin rather than rediscovering this independently.
  "mcp>=1.9.0,<2.0.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "pydantic>=2.7.0",
  # Real dependency (not just the local `.venv/sitecustomize.py` workaround)
  # so a Docker image (no colon-in-path, no sitecustomize hack) installs it
  # normally. Resolves via the root `pyproject.toml`'s
  # `[tool.uv.sources] devbrain-common = { workspace = true }`.
  "devbrain-common",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
task-mcp = "task_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
